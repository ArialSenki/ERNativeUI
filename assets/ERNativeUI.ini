[Logging]
; Set to 1 when troubleshooting or when collecting diagnostics for an issue.
EnableLog = 0

[Localization]
; "auto" follows Elden Ring's current Steam game language. To override it,
; use a lowercase identifier such as vietnamese. A matching file in locales
; translates host-owned text; the identifier is also reported to client mods.
Language = auto

[Runtime]
RegistrationQuietMs = 750
RegistrationMaxWaitMs = 15000
; Maximum conditional wait for Elden Ring's Steam API to initialize. This is
; not an unconditional delay: discovery releases immediately when ready. If
; the limit expires, menus continue with English localization fallback. This
; setting is ignored when Localization.Language is an explicit identifier.
SteamLanguageWaitMs = 5000
InjectionCooldownMs = 250

[Diagnostics]
; Detailed address, pagination, row-construction and callback traces.
EnableDiagnostics = 0
; 1 = every 30 s, log how often the UI text hooks ran and the time they took
; (for stutter reports; also turns the log on).
PerfLog = 0

[Gfx]
; 1 = adapt the options menu files (02_040 / 02_042) in memory while the game
; loads them. No menu files need to be installed, so other mods that replace
; them keep working. 0 = use installed patched GFX files instead.
RuntimePatch = 1
; Experimental: opacity of the options menu's full-screen background, in
; percent (100 = normal, 0 = none). Lower values let the game show through.
; Needs RuntimePatch = 1.
MenuBackgroundAlpha = 100
; Experimental HUD/menu layout. The game loads these movies once at startup, so
; restart it after a change. NativeTweaks
; sets all three from its own options at startup, so they only matter without it.
; 1 = on screens wider than 16:9, move the corner HUD elements to the edges.
HudToScreenEdges = 0
; Size of the corner HUD elements in percent (50-150), from their corner.
HudScale = 100
; 1 = also move the menus (pause menu, equipment, inventory, status, options)
; to the screen edges and widen their backgrounds. Never scaled.
MenusToScreenEdges = 0
